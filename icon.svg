<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Code workspace">
  <defs>
    <linearGradient id="iw-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6f5e"/>
      <stop offset="1" stop-color="#14312a"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#iw-bg)"/>
  <!-- window chrome: the editor frame -->
  <rect x="12" y="15" width="40" height="34" rx="4" fill="none" stroke="#ffffff" stroke-width="2.6" opacity="0.9"/>
  <path d="M12 23h40" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <!-- file tree column -->
  <path d="M21 27v17" fill="none" stroke="#8ff0c8" stroke-width="2" opacity="0.85"/>
  <g fill="#8ff0c8" opacity="0.9">
    <rect x="16.5" y="27" width="9" height="2.4" rx="1.2"/>
    <rect x="19.5" y="33" width="9" height="2.4" rx="1.2"/>
    <rect x="19.5" y="39" width="6" height="2.4" rx="1.2"/>
  </g>
  <!-- code lines on the right -->
  <g fill="#ffffff" opacity="0.85">
    <rect x="30" y="28" width="17" height="2.4" rx="1.2"/>
    <rect x="30" y="33.5" width="12" height="2.4" rx="1.2"/>
    <rect x="30" y="39" width="15" height="2.4" rx="1.2"/>
  </g>
</svg>
